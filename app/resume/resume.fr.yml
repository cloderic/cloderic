name: Clodéric Mars
job_title: Ingénieur IA et tech leader
contact:
  address: Montréal, Canada
  linkedIn: https://www.linkedin.com/in/cloderic
intro: |
  ## Résumé
  Je conçois et développe des **IAs décisionnelles qui équilibrent automatisation et supervision humaine**. Fort d’une expérience combinant leadership et expertise technique, j’ai
  mis en œuvre des systèmes collaboratifs humains-IA dans des contextes créatifs, industriels et opérationnels, tout en faisant évoluer équipes et produits vers une maturité de niveau entreprise.
  Je fais le lien entre recherche, ingénierie et produit pour générer un impact concret.
key_skills:
  - >
    **Leadership & Stratégie**: Gestion de programme, Gestion de projets R&D,
    Développement commercial technique & avant-vente, Transfert technologique,
    Recrutement.
  - >
    **Intelligence Artificielle**: Systèmes multi-agents, Apprentissage par
    renforcement (RL), Modèles de langage (LLM), IA explicable, Game AI.
  - >
    **Ingénierie logicielle & Infrastructure**: Architecture logicielle,
    Systèmes distribués, Infrastructure cloud, MLOps, Python, Go, C++, Rust,
    Javascript, Kubernetes, Kafka, AWS, Azure.
  - >
    **Informatique Spatiale**: Simulation, Géométrie computationnelle, Systèmes
    d’information géographique (SIG).
  - >
    **Communication**: Prise de parole en public, Rédaction technique, Français
    (langue maternelle), Anglais (professionnel).

experiences:
  title: Expériences
  items:
    - from: 2026-01
      location: Montréal, Canada
      title: >
        Director of Engineering & AI Architect - [**CM Labs
        Simulations**](https://www.cm-labs.com)
      description: |
        - Pilotage de l’ingénierie du produit Vortex Studio, la plateforme de simulation physique en temps réel de CM Labs, dédiée aux simulateurs d’entraînement, aux jumeaux numériques pour l’ingénierie et à l’IA physique.
        - Conception et mise en œuvre de l’architecture IA pour l’apprentissage adaptatif au sein des simulateurs d’entraînement de CM Labs, reposant sur des systèmes agentiques combinant intelligence conversationnelle et comportements incarnés en simulation.
        - Animation d’une organisation d’ingénierie pluridisciplinaire, réunissant des expertises en physique, simulation et IA, afin de concevoir des systèmes industriels, robustes et scalables.
    - from: 2025-04
      to: 2025-12
      location: Montréal, Canada
      title: >
        Principal AI/ML Platform Architect - **CM Labs Simulations**
      description: |
        _À la suite de l’acquisition d’AI Redefined par CM Labs en avril 2025, j’ai pris en charge la définition et le pilotage de la feuille de route IA de CM Labs._
        - Définition et pilotage de la feuille de route d’apprentissage adaptatif, en coordonnant quatre équipes pour livrer un MVP en six mois.
        - Conception et développement de systèmes IA temps réel assistant les apprenants et les instructeurs, combinant contrôleurs analytiques, apprentissage par renforcement (RL) et modèles de langage (LLM).
        - Mise en place des pratiques et infrastructures MLOps afin de permettre le développement, l’entraînement et le déploiement à l’échelle d’agents IA sur plusieurs produits.
    - from: 2021-02
      to: 2025-04
      location: Montréal, Canada
      title: >
        VP of Engineering - [**AI Redefined** (acquis par CM Labs
        Simulations)](https://www.ai-r.com)
      description: |
        - Structuration d’une équipe distribuée de 16+ ingénieurs et chercheurs, avec mise en place de processus agiles et orientation produit, ayant permis de générer ~1,5M$ de revenus récurrents via un modèle SaaS open-core.
        - Conception et entraînement d’agents décisionnels IA combinant apprentissage par renforcement, LLMs et IA symbolique ; déploiement réussi dans des cas d’usage industriels complexes.
        -	Production scientifique et propriété intellectuelle : 9 publications évaluées par les pairs et 3 brevets déposés.
        - Pilotage de partenariats stratégiques avec des acteurs majeurs de l’aérospatial, de l’énergie et de la recherche ([Thales](https://www.thalesgroup.com/), [CAE](https://www.cae.com/), [RTE](https://www.rte-france.com/), [Université d'Alberta](https://www.ualberta.ca/), [MILA](https://mila.quebec/), ...), avec intégration concrète de nos technologies.
        - Conduite de la due diligence technique lors du processus d’acquisition, jusqu’à la finalisation de l’opération.
    - from: 2020-08
      to: 2021-01
      location: Paris, France
      title: >
        Ingénieur IA Freelance - **AI Redefined**
      description: |
        _Début de poste à AI Redefined comme freelance avant de déménager au Canada_
    - from: 2015-03
      to: 2020-04
      location: Paris, France
      title: >
        Co-fondateur & CTO - [**craft ai**](https://www.craft.ai/)
      description: |
        - Lancement et développement de l’entreprise, portée à 20+ employés et ~9M€ levés en financement.
        - Direction des équipes produit et R&D, avec gestion des feuilles de route, budgets et ressources, aboutissant à ~1M€ de revenus récurrents.
        - Conception et déploiement d’un SaaS d’IA explicable pour la modélisation et la prévision de séries temporelles, facilitant la prise de décision automatisée et personnalisée.
        - Application concrète de la solution dans ~10 projets industriels (notamment [EDF](https://www.edfenergy.com/), [Total](https://www.totalenergies.fr)), générant des gains opérationnels significatives pour les utilisateurs finaux.
        - Valorisation de la recherche via 5 publications scientifiques et une base technologique transférée avec succès vers le marché.
    - from: 2012-01
      to: 2015-02
      location: Paris, France
      title: >
        Ingénieur Logiciel Lead & Product Manager - [**MASA
        Group**](https://masasim.com/)
      description: |
        - Direction d'une équipe de ~5 ingénieurs logiciels à Paris et Munich, en charge de l'alignement des priorités et l’allocation des ressources, en collaboration avec la direction de l’entreprise, pour atteindre les objectifs des projets.
        - Architecture et développement d'un outil de création et d'exécution d'agents IA, intégrant des moteurs de behavior trees et de raisonnement spatial. Cet outils permettait à des concepteurs pédagogiques et de jeux de créer et de contrôler des agents IA dans des simulations et jeux vidéo, aboutissant à une propriété intellectuelle clé à l’origine de **craft ai**.
    - from: 2010-01
      to: 2011-12
      location: Rennes, France
      title: >
        Ingénieur logiciel R&D - [**Golaem** (acquis par
        Autodesk)](http://golaem.com/)
      description: |
        - Prise en charge du moteur de navigation pour les foules virtuelles, industrialisant avec succès des prototypes de recherche et des algorithmes développés à Inria.
        - Application de la technologie de simulation de foules à divers cas d’utilisation, notamment l’évaluation de voitures de train pour [SNCF](https://www.groupe-sncf.com), la population en temps réel de villes virtuelles avec [Dassault Systèmes](https://www.3ds.com), et la simulation de foules pour un documentaire historique avec [Mikros](https://www.technicolor.com/studios/mikros-animation/). Ce dernier projet a contribué au développement du principal produit de simulation de foules pour le marché de l’animation et des effets visuels.
    - from: 2009-02
